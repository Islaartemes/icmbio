[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "icmbio-pipeline"
version = "0.1.0"
description = "Pipeline de dados de areas embargadas do ICMBio"
requires-python = ">=3.11"
dependencies = [
    "pg8000>=1.31,<2",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<3",
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.1,<2",
    "matplotlib>=3.9,<4",
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "pytest>=8.3,<9",
]

[project.scripts]
icmbio-pipeline = "icmbio_pipeline.pipeline:principal"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

