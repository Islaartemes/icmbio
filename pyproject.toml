[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "icmbio-pipeline"
version = "0.1.0"
description = "Pipeline de dados de areas embargadas do ICMBio"
requires-python = ">=3.11"
dependencies = [
    "pg8000>=1.31,<2",
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[project.scripts]
icmbio-pipeline = "icmbio_pipeline.pipeline:principal"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]